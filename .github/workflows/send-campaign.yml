name: Send Campaign

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send campaign
        run: node scripts/send-campaign.mjs
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          MAILCHIMP_REPLY_TO: ${{ secrets.MAILCHIMP_REPLY_TO }}
          UPDATE_FALLBACK_LINK: ${{ secrets.UPDATE_FALLBACK_LINK }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
